<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S太郎 - Midnight Run</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="layout">
      <section class="game-shell">
        <header class="hud">
          <h1>S太郎 - Midnight Run</h1>
          <div class="stats">
            <span id="distance">Distance: 0m</span>
            <span id="score">Score: 0</span>
            <span id="state">Ready</span>
          </div>
        </header>
        <canvas id="game" width="1280" height="720" aria-label="横スクロールゲーム"></canvas>
        <footer class="controls">
          <p>操作: <kbd>Space</kbd> / <kbd>↑</kbd> ジャンプ, <kbd>D</kbd> ダッシュ, <kbd>R</kbd> リスタート</p>
          <button id="startButton">START</button>
        </footer>
      </section>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
